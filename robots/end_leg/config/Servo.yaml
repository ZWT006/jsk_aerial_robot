servo_controller:
  # ServoControlCmd and startup configuration use the same global servo id.
  # ServoBridge resolves it to the detected board and board-local servo slot.
  auto_configure_direct_servo: true
  direct_servo_config_timeout: 10.0
  servo_feedback_frequency: 200
  servo_target_watchdog: 0.1
  dynamixel_ttl_rs485_mixed: true

  gimbals:
    no_real_state: false
    bus_type: T

    # Beetle omni gimbal servo: Dynamixel XC330-T181.
    angle_sgn: 1
    angle_scale: 0.001533981
    velocity_scale: 0.02398082
    torque_scale: 0.00064
    zero_point_offset: 2048
    p_gain: 1200
    i_gain: 0
    d_gain: 500
    profile_velocity: 0
    current_limit: 2352
    send_data_flag: true
    external_encoder_flag: false
    joint_resolution: 1
    servo_resolution: 1

    # id is the global index shared by feedback, control, and configuration.
    controller1:
      id: 0
      mode: MIT
      name: gimbal1
      bus_type: R
      # Dynamixel XM430-W350-R
      angle_scale: 0.00076699
      # 0.229 rev/min
      velocity_scale: 0.01199041
      # 0.7142857 Nm/ A * 0.00296 A/bit * 2 = 0.0042285714 Nm/bit
      torque_scale: 0.00384286
      zero_point_offset: 2047
      p_gain: 800
      i_gain: 0
      d_gain: 4000
      mit_kp_si: 4.8309
      mit_kd_si: 0.3075
      mit_effort_limit_si: 6.2

      profile_velocity: 0
      current_limit: 1193

    controller2:
      id: 1
      name: gimbal2
      mode: DP
      bus_type: T
      mit_kp_si: 0.45
      mit_kd_si: 0.008
      mit_effort_limit_si: 0.38

    controller3:
      id: 2
      name: gimbal3
      mode: MIT
      bus_type: T
      mit_kp_si: 0.45
      mit_kd_si: 0.008
      mit_effort_limit_si: 0.38

