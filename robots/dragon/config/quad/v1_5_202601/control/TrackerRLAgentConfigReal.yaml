aerial_robot_control_name: aerial_robot_control/dragon_tracker_rlagent

# roslaunch dragon bringup_rl_tracking.launch rm:=False sim:=True headless:=False
# roslaunch dragon bringup_rl_tracking.launch rm:=True sim:=False headless:=True
# roslaunch motor_test servo_response.launch robot_ns:=dragon

# Whole-body target-state tracking RL agent for DRAGON.
# Target states are supplied online as aerial_robot_msgs/FullStateTarget. The
# agent keeps a FIFO of the latest target frames and flattens it into the
# training-style target observation block.

# policy-2026-07-10_13-50-35-20.5k.onnx # first baseline, successful deploy with OCP: joint parameters
# policy-2026-07-15_21-53-07-20k.onnx   # large odom noise and delay, cannot work with sim_estimate_mode = 1
# policy-2026-07-16_19-25-55-30k.onnx   #
# policy-2026-07-18_21-58-48-20k.onnx   #
# policy-2026-07-19_13-36-15-30k.onnx   # 
# policy-2026-07-20_13-47-15-30k.onnx   # second baseline, successful with different gimbal/joint parameters
# policy-2026-07-22_11-33-00-30k.onnx   #
# policy-2026-07-23_21-18-16-25k.onnx   #


# policy-2026-09-18_22-19-13-27k.onnx   # amp with diverse trajectories

# -------------------------------------------------------------------------
# replace dof vel with last pos
# deploy-2026-09-29_22-22-24-30k.onnx   # identified gimbal kp,kd
# deploy-2026-10-01_22-07-58-25k.onnx   # changed delay align with 40Hz
# policy-2026-10-02_22-17-41-22k.onnx   # multi-trajectory training
# deploy-2026-10-02_22-17-41-36k.onnx   # gimbal_roll_act = 0.25
# deploy-2026-10-04_21-43-00-29k.onnx   # gimbal_roll_act = 0.125, ang_vel = 0.2

# -------- scaled action, ang_vel = 1.0 -------------------------------------
# deploy-2026-10-08_14-41-03-30k.onnx   # 
# -------- thrust_limit 14.5 ------------------------------------------------
# deploy-2026-10-09_20-57-20-30k.onnx   # estimator,
# deploy-2026-10-11_22-48-16-49k.onnx   # history mode

# rosservice call /dragon/rlagent/reload_policy \
#   "policy_name: 'policy/policy-2026-07-23_21-18-16-25k.onnx'"

rlagent:
  onnx_model_path: "policy/deploy-2026-10-04_21-43-00-29k.onnx"
  decimation: 5

  # ---- target-state FIFO ----
  target_state_topic: "full_state_target"
  target_obs_horizon: 5
  target_obs: [root_pos, root_rot_vec, joint_pos]

  # ---- observation/action composition ----
  # Available observation terms:
  #   target_obs_history, joint_pos, joint_vel, gimbal_pos, gimbal_vel,
  #   root_rot_vec, lin_vel, ang_vel, last_action
  observations: [
    target_obs_history,
    joint_pos,
    joint_vel,
    gimbal_pos,
    gimbal_vel,
    root_rot_vec,
    lin_vel,
    ang_vel,
    last_action
  ]
  # History (training history_mode): obs = observations | history_length x history_terms,
  # past frames ordered [t-1, ..., t-H]. To match training, history_terms = every
  # observations term except target_obs_history, and history_length = obs_history_len.
  history_length: 1
  history_terms: []
  actions: [joint, gimbal, thrust]

  # ---- observation source ----
  ideal_obs: false
  ideal_obs_topic: "/dragon/ground_truth" # /dragon/ground_truth, /dragon/uav/baselink/odom
  ideal_pos_obs: false
  ideal_quat_obs: true
  ideal_lin_vel_obs: false
  ideal_ang_vel_obs: true
  ideal_delay: 4
  # Put previous policy-step positions into dof_vel observation slots.
  replace_dof_vel_with_last_pos: true
  # Feed last_action scaled per group (joint*joint_act | gimbal*roll/pitch_act |
  # thrust*thrust_act*thrust_obs), as _aars_scale_actions_for_observation in training.
  scaled_last_action: false

  # ---- actuator layout (sim order; must match training) ----
  joint_names: [joint1_yaw, joint2_pitch, joint1_pitch, joint2_yaw, joint3_pitch, joint3_yaw]
  gimbal_names: [gimbal2_roll, gimbal2_pitch, gimbal1_roll, gimbal3_roll,
                 gimbal1_pitch, gimbal3_pitch, gimbal4_roll, gimbal4_pitch]
  thrust_pair_names: [edf2, edf1, edf3, edf4]
  # joint_default: {joint1_yaw: 0.0}
  # gimbal_default: {gimbal1_roll: 0.0}

  # ---- command gates / shaping ----
  enable_thrust: true
  enable_joint: false
  enable_gimbal: false
  joint_effort_ctrl: false
  gimbal_effort_ctrl: false
  thrust_hover: 8.5
  thrust_limit: 14.5
  thrust_scale: 1.0
  # Clamp scaled joint/gimbal targets without changing action_ or last_action.
  action_clamp: false
  joint_limit: 1.5708
  gimbal_roll_limit: 0.25
  gimbal_pitch_limit: 0.5
  joint_target_delay_steps: 0
  gimbal_target_delay_steps: 0
  thrust_target_delay_steps: 0

  # ---- logging ----
  rlagent_verbose: true
  rlagent_debug: true
  rlagent_forward_info: true

  # ---- scales (training: normalization.obs_scales + control action scales) ----
  # Overridden (with a WARN on mismatch) by the ONNX 'dragon_cfg' metadata when the policy
  # carries it; together with thrust_hover, replace_dof_vel_with_last_pos.
  scales:
    dof_vel: 0.5
    dof_delta: 1.0   # (pos - last_pos) slots when replace_dof_vel_with_last_pos
    lin_vel: 1.0
    ang_vel: 0.2
    thrust_obs: 0.1   # obs_scales.thrust, applied to last_action thrust only
    joint_act: 0.15
    gimbal_roll_act: 0.125
    gimbal_pitch_act: 0.25
    thrust_act: 0.5
    clip_observation: 100.0
    clip_action: 100.0
