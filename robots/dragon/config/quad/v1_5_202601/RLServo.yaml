servo_controller:
  auto_configure_direct_servo: true
  direct_servo_config_timeout: 10.0
  servo_feedback_frequency: 200 # keep previous dragon settings
  servo_target_watchdog: 0.1
  dynamixel_ttl_rs485_mixed: true
  
  joints:
    startup_torque_enable: false
    angle_sgn: 1
    angle_scale: 0.00076699
    velocity_scale: 0.01199041 # 0.229 [rev/min] -> rad/s, scaled by 2:1 pulley
    zero_point_offset: 2047
    torque_scale: 0.009415 # 1.75 Nm/ A * 0.00296 A/bit * 2 (pulley)
    mode: MIT # Current-based Position control mode
    bus_type: R
    mit_kp_si: 4.8309
    mit_kd_si: 0.3075
    mit_effort_limit_si: 6.2

    filter_flag: false
    sample_freq: 200.0
    cutoff_freq: 10.0

    controller1:
      id: 1
      name: joint1_pitch
    controller2:
      id: 0
      name: joint1_yaw
      simulation:
        init_value: 1.57  # for rough_calib
    controller3:
      id: 5
      name: joint2_pitch
    controller4:
      id: 4
      name: joint2_yaw
      simulation:
        init_value: 1.57
    controller5:
      id: 9
      name: joint3_pitch
    controller6:
      id: 8
      name: joint3_yaw
      simulation:
        init_value: 1.57

  gimbals:
    no_real_state: false
    startup_torque_enable: false
    angle_sgn: 1
    angle_scale: 0.001534
    velocity_scale: 0.02398082 # 0.229 [rev/min] -> rad/s
    zero_point_offset: 2047
    torque_scale: 0.0027976  # Nm/raw
    mode: CbP # Current-based Position control mode
    bus_type: T
    mit_kp_si: 1.5396 # 0.6349
    mit_kd_si: 0.04732 # 0.01183
    mit_effort_limit_si: 1.9 # 0.38

    controller1:
      id: 3
      name: gimbal1_roll
    controller2:
      id: 2
      name: gimbal1_pitch
      mode: DEP # Extended Position Control
      mit_kp_si: 0.6349
      mit_kd_si: 0.01183
      effort_limit: 0.38
    controller3:
      id: 7
      name: gimbal2_roll
    controller4:
      id: 6
      name: gimbal2_pitch
      mode: DEP # Extended Position Control
      mit_kp_si: 0.6349
      mit_kd_si: 0.01183
      effort_limit: 0.38
    controller5:
      id: 11
      name: gimbal3_roll
    controller6:
      id: 10
      name: gimbal3_pitch
      mode: DEP # Extended Position Control
      mit_kp_si: 0.6349
      mit_kd_si: 0.01183
      effort_limit: 0.38
    controller7:
      id: 13
      name: gimbal4_roll
    controller8:
      id: 12
      name: gimbal4_pitch
      mode: DEP # Extended Position Control
      mit_kp_si: 0.6349
      mit_kd_si: 0.01183
      effort_limit: 0.38
