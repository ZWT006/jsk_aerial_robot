# policy-2026-01-03_15-04-36-17000.onnx # fault obs: false, add pose delay
# policy-2026-01-04_20-19-20-2000.onnx # history obs
rlagent:
  onnx_model_path: "policy/policy-2026-01-03_15-04-36-17000.onnx" # Path in ros package
  control_freq: 400.0
  decimation: 2
  history_obs: false
  single_obs_size: 27
  history_length: 4
  fault_injection: true
  fault_obs: false
  fault_goal: false  # degraded goal when fault injected
  ideal_obs: false
  # ideal_obs_topic: "uav/cog/odom"
  ideal_obs_topic: "uav/baselink/odom"
  ideal_delay: 0
  fc2root_transform: true
  rlagent_verbose: false
  rlagent_debug: true
  rlagent_forward_info: true
  gimbal_target_delay_steps: 0
  gimbal_obs_delay_steps: 0
  enable_thrust: true
  thrust_scale: 1.0
  thrust_tau: 0.0 # 0.0342
  thrust_target_delay_steps: 1
  enable_gimbal: true
  goal_pos_x: 0.0
  goal_pos_y: 0.0
  goal_pos_z: 1.2
  goal_angle_R: 0.0
  goal_angle_P: 0.0
  goal_angle_Y: 0.0
  thrust_default: 7.0 # 6.0 before 3.
  thrust_limit: 20.0
  gimbal_default: {gimbal1: 0.0, gimbal2: 0.0, gimbal3: 0.0, gimbal4: 0.0}
  # gimbal_kp: 0.285
  # gimbal_kd: 0.019
  gimbal_kp: 0.344964875
  gimbal_kd: 0.0094725 # 
  gimbal_effort_ctrl: true
  gimbal_size: 4
  thrust_size: 4
  scales:
    lin_vel: 1.0
    agn_vel: 0.2
    gimbal_act: 0.25
    thrust_act: 0.50  # 1.25 before 3.
    clip_observation: 100.0
    clip_action: 100.0