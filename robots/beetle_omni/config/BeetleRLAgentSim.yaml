# policy-2026-03-14_15-50-02-20000.onnx

# policy-2026-03-18_17-14-42-20000.onnx
# policy-2026-03-22_23-33-02-20000.onnx # beetle-rl urdf, with benchmark training
# policy-2026-03-30_21-08-51-20000.onnx # fault tolerant (SE3 Pose)
# policy-2026-03-31_12-08-11-20000.onnx # fault tolerant (yaw only)
