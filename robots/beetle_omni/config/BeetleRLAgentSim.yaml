# policy-2026-07-08_21-45-49-30000.onnx # beetle se3 nwe kp,kd

# rosservice call /beetle_omni/rlagent/reload_policy \
#   "policy_name: 'policy/policy-2026-06-13_09-46-13-30000.onnx'"

rlagent:
  onnx_model_path: "policy/policy-2026-07-08_21-45-49-30000.onnx" # Path in ros package
  decimation: 2
  history_length: 4  # only used if history_terms below is non-empty
  fault_injection: true
  fault_goal: true  # degraded goal when fault injected
  # Observation vector: order + content, assembled in this exact order.
  # Available terms: goal_pos(3), gimbal_pos(4), gimbal_vel(4), rotor_thrust(4), root_rot_vec(6), goal_rot_vec(6),
  #                  imu_acc(3), imu_gyr(3), last_action(8), lin_vel(3), ang_vel(3), gravity(3), fault_obs(4)
  observations: [
    goal_pos,
    gimbal_pos,
    root_rot_vec,
    goal_rot_vec,
    last_action,
    lin_vel,
    ang_vel
  ]
  # Subset of `observations` (above) that gets stacked history_length times, most-recent-first.
  # Empty = no history stacking, `observations` is just concatenated once.
  history_terms: []
  # Action vector: order in which the policy's output is sliced and applied.
  actions: [gimbal, thrust]
  ideal_obs: false
  # ideal_obs_topic: "uav/cog/odom"
  ideal_obs_topic: "uav/baselink/odom"
  ideal_delay: 0
  fc2root_transform: true
  rlagent_verbose: false
  rlagent_debug: true
  rlagent_forward_info: true
  gimbal_target_delay_steps: 0
  gimbal_obs_delay_steps: 0
  enable_thrust: true
  thrust_scale: 1.0
  thrust_tau: 0.0 # 0.0342
  thrust_target_delay_steps: 1
  enable_gimbal: true
  goal_pos_x: 0.0
  goal_pos_y: 0.0
  goal_pos_z: 1.2
  goal_angle_R: 0.0
  goal_angle_P: 0.0
  goal_angle_Y: 0.0
  thrust_default: 7.0 # 6.0 before 3.
  thrust_limit: 20.0
  gimbal_default: {gimbal1: 0.0, gimbal2: 0.0, gimbal3: 0.0, gimbal4: 0.0}
  # gimbal_kp: 0.285
  # gimbal_kd: 0.019
  # gimbal_kp: 0.344964875
  # gimbal_kd: 0.0094725 # 
  gimbal_kp: 0.45
  gimbal_kd: 0.008 # 
  gimbal_limit: 5.5 # rad
  gimbal_effort_ctrl: true
  gimbal_size: 4
  thrust_size: 4
  scales:
    lin_vel: 1.0
    ang_vel: 0.2
    dof_vel: 0.2
    gyroc: 0.2
    accel: 0.1
    rotor: 0.1
    gimbal_act: 0.25
    thrust_act: 0.50  # 1.25 before 3.
    clip_observation: 100.0
    clip_action: 100.0