# --- Interface ---
source [find interface/stlink.cfg]
transport select hla_swd

# --- Target ---
source [find target/stm32h7x.cfg]

# --- Adapter speed (keep low for ST-Link V2) ---
adapter speed 2000

# --- Reset strategy ---
# Use 'none' when NRST is not wired (software reset only)
reset_config none
